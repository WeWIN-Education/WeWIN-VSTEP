services:
  postgres:
    image: postgres:16-alpine
    container_name: hanbeego-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: hanbeego
      POSTGRES_PASSWORD: hanbeego
      POSTGRES_DB: hanbeego
    volumes:
      - hanbeego_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hanbeego -d hanbeego"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hanbeego_pg_data:
